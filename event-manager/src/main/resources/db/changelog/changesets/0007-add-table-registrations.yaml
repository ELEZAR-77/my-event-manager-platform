databaseChangeLog:
  - changeSet:
      id: 0007-add-table-registrations
      author: OMAR
      changes:
        - createTable:
            tableName: registrations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: registrations
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_registrations_user

        - addUniqueConstraint:
            tableName: registrations
            columnNames: event_id, user_id
            constraintName: uk_registration_event_user