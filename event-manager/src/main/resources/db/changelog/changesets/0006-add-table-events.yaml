databaseChangeLog:
  - changeSet:
      id: 0006-add-table-events
      author: OMAR
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_name
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: start_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: max_places
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: occupied_places
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: event_status
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: location_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: location_id
            referencedTableName: locations
            referencedColumnNames: id
            constraintName: fk_events_location

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_events_user